[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ─── Open Graph por tarjeta ───────────────────────────────────────────────────
# WhatsApp lee el HTML sin ejecutar JavaScript, así que la preview de un link no
# puede armarla la SPA. Esta función reescribe los meta tags en el servidor.
[[edge_functions]]
  path = "/preview/*"
  function = "og"

# ─── Assets que no existen deben dar 404, no la app ──────────────────────────
# La regla de SPA de abajo atrapa CUALQUIER ruta, incluidos los archivos que no
# existen: pedir /assets/HomePage-viejo.js devolvia index.html con status 200 y
# content-type text/html. El navegador entonces falla al interpretarlo como
# modulo y tira un error de MIME confuso, en vez de un 404 limpio.
# Pasa de verdad: un visitante con la pagina abierta de antes de un deploy pide
# un chunk que ya no existe.
[[redirects]]
  from = "/assets/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/allegories/*"
  to = "/index.html"
  status = 404

# ─── SPA ──────────────────────────────────────────────────────────────────────
# Sin esto, entrar directo a /preview/cenicienta-baile devuelve 404: Netlify
# busca un archivo en esa ruta y no existe, porque el ruteo es del lado del
# cliente. Es exactamente el caso de todo link compartido por WhatsApp, así que
# esta regla no es opcional.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ─── Caché ────────────────────────────────────────────────────────────────────
# Los bundles llevan hash en el nombre: cambian de nombre al cambiar de
# contenido, así que se pueden cachear para siempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Los assets de las alegorías NO llevan hash. Un día fresco y una semana
# sirviendo la copia vieja mientras se revalida en segundo plano: el invitado
# que vuelve a abrir la tarjeta no vuelve a bajar el video.
[[headers]]
  for = "/allegories/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

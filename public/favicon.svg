<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FX Estudio">
  <!-- Sello relleno: mismo tratamiento que el logotipo de la barra, para que el
       ícono de la pestaña y la marca del sitio sean el mismo símbolo.
       Las letras van trazadas como paths y no como texto, así no dependen de
       que la tipografía esté cargada — en la pestaña eso no está garantizado. -->
  <rect width="64" height="64" rx="13" fill="#C9A96E"/>
  <g fill="#241E12">
    <!-- F -->
    <path d="M15 19h16.5v4.6H20.2v6.1h10.2v4.6H20.2V45H15z"/>
    <!-- X -->
    <path d="M34.2 19h5.9l4.7 8.2 4.7-8.2h5.9l-7.6 12.7L55.6 45h-6l-5-8.7-5 8.7h-6l7.8-13.3z"/>
  </g>
</svg>

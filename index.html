<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#FDFBF6" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FX Estudio — Invitaciones Web &amp; Diseño</title>
    <meta name="description" content="Invitaciones digitales hechas a medida para casamientos, 15 años y eventos. Con video, música e ilustraciones propias. Entrega en 48 horas." />
    <link rel="canonical" href="https://fxestudio.com.ar/" />

    <!--
      Open Graph. These cards are shared over WhatsApp, so this block is what
      decides whether a link looks like a product or like a bare URL.
      NOTE: this is static, so every route shares it. A per-card preview needs
      the tags injected at request time (a Netlify Edge Function) — the SPA
      cannot do it, because WhatsApp reads the HTML without running JavaScript.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FX Estudio" />
    <meta property="og:title" content="FX Estudio — Invitaciones Web &amp; Diseño" />
    <meta property="og:description" content="Invitaciones digitales hechas a medida. Con video, música e ilustraciones propias. Entrega en 48 horas." />
    <meta property="og:url" content="https://fxestudio.com.ar/" />
    <meta property="og:image" content="https://fxestudio.com.ar/allegories/cenicienta/fondo.jpeg" />
    <meta property="og:locale" content="es_AR" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Every family referenced by a template must be listed here, or it silently
      falls back to the system serif/sans. Check with:
        rg -o "(font-family|fontFamily[A-Za-z]*)[^;\n}]*" src | rg -o "'[A-Za-z][A-Za-z ]+'" | sort -u
      Listing a family costs one small CSS request; the .woff2 files are only
      downloaded for families the rendered page actually uses.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;600&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Sans:wght@400;500;700&family=Dancing+Script:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Lato:wght@300;400;700&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Raleway:wght@300;400;600&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
